<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Components — Premium UI Component Library</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!--
    COMPONENT MARKETPLACE DASHBOARD
    Pure HTML, CSS, and vanilla JavaScript.
    All components are defined inside script.js.
  -->

  <!-- ============================================================
       TOP NAVIGATION
       ============================================================ -->
  <header class="top-nav">
    <div class="top-nav__inner">
      <a href="#" class="logo">
        <span class="logo__mark"></span>
        <span class="logo__text">Components</span>
      </a>

      <div class="search">
        <svg class="search__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" class="search__input" placeholder="Search components..." aria-label="Search components" />
      </div>

      <div class="top-nav__actions">
        <a href="#" class="nav-link">GitHub</a>
        <a href="#" class="nav-link">Docs</a>
        <button class="theme-toggle" aria-label="Toggle theme">
          <svg class="theme-toggle__sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="theme-toggle__moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
        <button class="menu-toggle" aria-label="Open menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- ============================================================
       DASHBOARD
       ============================================================ -->
  <div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__header">
        <span class="sidebar__title">Components</span>
        <button class="sidebar__close" aria-label="Close menu">×</button>
      </div>
      <nav class="sidebar__nav" id="category-nav" aria-label="Component categories"></nav>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Main Content -->
    <main class="main" id="main">
      <div class="main__header">
        <div>
          <span class="main__eyebrow" id="category-eyebrow">Library</span>
          <h1 class="main__title" id="category-title">All Components</h1>
          <p class="main__desc" id="category-desc">Browse reusable UI components built with HTML, CSS, and vanilla JavaScript.</p>
        </div>

        <div class="filters" id="filters">
          <button class="filter-chip is-active" data-filter="all">All</button>
          <button class="filter-chip" data-filter="free">Free</button>
          <button class="filter-chip" data-filter="interactive">Interactive</button>
          <button class="filter-chip" data-filter="css">CSS</button>
          <button class="filter-chip" data-filter="javascript">JavaScript</button>
          <button class="filter-chip" data-filter="3d">3D</button>
        </div>
      </div>

      <div class="component-grid" id="component-grid"></div>

      <div class="empty-state" id="empty-state" hidden>
        <p>No components found.</p>
      </div>
    </main>

  </div>

  <!-- ============================================================
       COMPONENT DETAIL MODAL
       ============================================================ -->
  <div class="modal" id="code-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal__overlay" id="modal-overlay"></div>
    <div class="modal__content">
      <div class="modal__header">
        <div>
          <h2 class="modal__title" id="modal-title">Component Name</h2>
          <p class="modal__meta">
            <span id="modal-category">Category</span>
            <span id="modal-tags">Interactive · Free</span>
          </p>
        </div>
        <button class="modal__close" aria-label="Close modal">×</button>
      </div>

      <div class="modal__mobile-switch" role="tablist" aria-label="Modal view">
        <button class="modal__mobile-tab is-active" type="button" data-modal-view="preview">Preview</button>
        <button class="modal__mobile-tab" type="button" data-modal-view="code">Code</button>
      </div>

      <div class="modal__body">
        <section class="preview-stage" data-preview-stage>
          <div class="preview-toolbar">
            <div class="preview-toolbar__title">Preview</div>
            <div class="preview-toolbar__controls">
              <div class="viewport-controls" aria-label="Preview viewport">
                <button class="viewport-btn is-active" type="button" data-viewport="desktop">Desktop</button>
                <button class="viewport-btn" type="button" data-viewport="tablet">Tablet</button>
                <button class="viewport-btn" type="button" data-viewport="mobile">Mobile</button>
              </div>
              <button class="preview-action" type="button" data-preview-refresh>Refresh</button>
              <button class="preview-action" type="button" data-preview-fullscreen>Fullscreen</button>
              <button class="preview-action" type="button" data-preview-open>Open</button>
            </div>
          </div>
          <div class="preview-workspace">
            <div class="preview-viewport is-desktop" id="preview-viewport">
              <div class="modal__preview" id="modal-preview"></div>
            </div>
          </div>
        </section>

        <div class="resize-handle" data-resize-handle>
          <span class="resize-handle__grip"></span>
        </div>

        <aside class="code-tabs" data-code-tabs>
          <div class="code-tabs__topbar">
            <div class="code-tabs__label">Code</div>
            <div class="code-tabs__nav" role="tablist" aria-label="Code language">
              <button class="code-tabs__tab is-active" data-tab="html" role="tab" aria-selected="true" aria-controls="modal-code-html" id="modal-tab-html">HTML</button>
              <button class="code-tabs__tab" data-tab="css" role="tab" aria-selected="false" aria-controls="modal-code-css" id="modal-tab-css">CSS</button>
              <button class="code-tabs__tab" data-tab="js" role="tab" aria-selected="false" aria-controls="modal-code-js" id="modal-tab-js">JavaScript</button>
              <button class="code-tabs__tab" data-tab="implement" role="tab" aria-selected="false" aria-controls="modal-code-implement" id="modal-tab-implement">Implement</button>
            </div>
          </div>

          <div class="code-tabs__panels">
            <div class="code-tabs__panel is-active" id="modal-code-html" role="tabpanel" aria-labelledby="modal-tab-html" data-panel="html">
              <div class="code-editor">
                <div class="code-editor__header">
                  <span></span><span></span><span></span>
                  <span class="code-editor__filename">index.html</span>
                  <button class="code-editor__copy" type="button" data-copy-btn>Copy</button>
                </div>
                <pre class="code-editor__pre"><code class="code-editor__code" id="modal-code-html-content"></code></pre>
              </div>
            </div>
            <div class="code-tabs__panel" id="modal-code-css" role="tabpanel" aria-labelledby="modal-tab-css" data-panel="css" hidden>
              <div class="code-editor">
                <div class="code-editor__header">
                  <span></span><span></span><span></span>
                  <span class="code-editor__filename">style.css</span>
                  <button class="code-editor__copy" type="button" data-copy-btn>Copy</button>
                </div>
                <pre class="code-editor__pre"><code class="code-editor__code" id="modal-code-css-content"></code></pre>
              </div>
            </div>
            <div class="code-tabs__panel" id="modal-code-js" role="tabpanel" aria-labelledby="modal-tab-js" data-panel="js" hidden>
              <div class="code-editor">
                <div class="code-editor__header">
                  <span></span><span></span><span></span>
                  <span class="code-editor__filename">script.js</span>
                  <button class="code-editor__copy" type="button" data-copy-btn>Copy</button>
                </div>
                <pre class="code-editor__pre"><code class="code-editor__code" id="modal-code-js-content"></code></pre>
              </div>
            </div>
            <div class="code-tabs__panel" id="modal-code-implement" role="tabpanel" aria-labelledby="modal-tab-implement" data-panel="implement" hidden>
              <div class="implementation-panel" id="modal-implementation"></div>
            </div>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite" hidden>Copied!</div>

  <script src="script.js"></script>
</body>
</html>
